---
# ============================================================
# CLAM WRF/WPS - global variables
#
# These mirror the environment variables the build_scripts accept.
# Override them in the inventory, in host_vars/, or on the command
# line with -e.
# ============================================================

# ------------------------------------------------------------
# Deployment mode selector
# ------------------------------------------------------------
# true  -> deploy the prebuilt Apptainer image + run scripts
#          (apptainer, intel_mpi, sif_deploy, run_scripts_deploy roles)
# false -> build WRF/WPS from source on the host
#          (system_packages, intel_oneapi, arw_libs, wrf_wps, wps_geog,
#           eccodes roles)
clam_use_container: true

# ------------------------------------------------------------
# Source-build variables (used when clam_use_container=false)
# ------------------------------------------------------------

# Installation root. The scripts default to ${HOME}/ARW; on EWC a
# directory on the data volume is recommended, e.g. /data/ARW.
arw_root: "{{ ansible_user_dir }}/ARW"

arw_libraries_dir: "{{ arw_root }}/LIBRARIES"
arw_src_dir: "{{ arw_root }}/src"
arw_tests_dir: "{{ arw_root }}/TESTS"
arw_runs_dir: "{{ arw_root }}/RUNS"
arw_jasper_dir: "{{ arw_root }}/JASPER-1.900.1"

wrf_dir: "{{ arw_root }}/WRF"
wps_dir: "{{ arw_root }}/WPS"

# The environment file written by the arw_libs role and sourced by every
# later build step. This is the Ansible equivalent of
#   source ${ARW_ROOT}/arw_intel_env.sh
arw_env_file: "{{ arw_root }}/arw_intel_env.sh"

# Parallel jobs for the third-party libraries (BUILD_JOBS in script 02).
arw_build_jobs: 4

# Set to true to select the ECMWF open data variant of step 03
# (03_install_wrf_wps_openData.sh): ungrib is patched so that it can
# decode the ECMWF open data GRIB2 files.
wps_ecmwf_opendata: false

# Existing WRF/WPS executables are left alone by default, so the
# playbook can be re-run cheaply. The shell scripts always run
# "./clean -a" and rebuild; set these to true for that behaviour.
wrf_force_rebuild: false
wps_force_rebuild: false

# Run-script variants copied to {{ arw_root }} on the target after the
# build, so a source-built VM can drive a run without the repo checked
# out there. The shell workflow runs these in place from the repo clone.
arw_run_variants:
  - run_scripts
  - run_scripts_large
  - run_scripts_opendata

# ------------------------------------------------------------
# Container-deployment variables (used when clam_use_container=true)
# ------------------------------------------------------------

# Repository directories on the Ansible control node, relative to this
# playbook (clam-ewc/ansible/). Used as copy sources.
clam_repo_root: "{{ playbook_dir }}/.."
clam_container_src: "{{ clam_repo_root }}/container"

# Where the launcher scripts and run_scripts variants are deployed on the
# target host.
clam_deploy_dir: "{{ ansible_user_dir }}/clam-ewc"

# SIF image: source on the control node, destination on the target.
# Build it first with ../container/build_sif.sh; override clam_sif_src if the
# file lives elsewhere (e.g. -e clam_sif_src=/mnt/data1/clam-wrf.sif).
clam_sif_src: "{{ clam_repo_root }}/clam-wrf.sif"
clam_sif_dest: "{{ clam_deploy_dir }}/clam-wrf.sif"

# Optionally BUILD the SIF on the target from a container registry reference
# instead of copying a prebuilt file. When set, `apptainer build` pulls this
# reference into clam_sif_dest (clam_sif_src is then ignored). Examples:
#   docker://ghcr.io/<org>/clam-wrf:latest
#   oras://registry.example.com/clam-wrf:2026.0
clam_sif_registry: ""
# Rebuild even if clam_sif_dest already exists.
clam_sif_force_build: false
# Credentials for a PRIVATE registry (registry build only). Leave the username
# empty for public images. The PASSWORD is not stored here: it is supplied
# non-interactively via -e clam_registry_password=... or an encrypted
# -e @vault.yml.
clam_registry_username: ""

# Host data directory bound into the container at /data (GEOG/ BC/ RUNS/).
clam_data_dir: "{{ ansible_user_dir }}/clam-data"

# Which bundled run-script variants to deploy to the host (handy as
# RUN_SCRIPTS overrides; the image already bundles them too).
clam_run_variants:
  - run_scripts
  - run_scripts_large
  - run_scripts_opendata

# Apptainer version: empty => Ubuntu apptainer/ppa package; set e.g. "1.3.6"
# to install the official GitHub release .deb instead.
apptainer_version: ""

# Install Intel MPI on the host ONLY when needed. Single-node runs need just
# Apptainer; MULTI-NODE runs need the host mpirun/Hydra launcher (same release
# as the image). Set true for multi-node hosts, e.g. -e clam_install_oneapi=true.
clam_install_oneapi: false
