[defaults]
inventory            = inventory/hosts.ini
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
# Left at the built-in default callback on purpose: the nicer "yaml"
# stdout callback is not part of ansible-core, it needs the
# community.general collection, and this playbook deliberately has no
# collection dependencies. To use it anyway:
#   ansible-galaxy collection install community.general
#   ANSIBLE_STDOUT_CALLBACK=community.general.yaml ansible-playbook site.yml
#
# The WRF and ecCodes builds print a lot and take hours; keep the output
# readable and do not let a long-running task look like a hang.
display_skipped_hosts = False
timeout              = 60

[ssh_connection]
pipelining = True
# Long compiles are run with async/poll, but keep the control path alive
# for the tasks that are not.
ssh_args = -o ControlMaster=auto -o ControlPersist=15m -o ServerAliveInterval=30
