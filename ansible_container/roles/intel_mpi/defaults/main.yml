---
# Install the Intel MPI runtime + launcher (mpirun / Hydra) from the Intel
# oneAPI APT repo. This is the HOST launcher needed for multi-node runs
# (container/run_multinode.sh). wrf.exe inside the container uses the image's
# ABI-compatible Intel MPI, so the host release should match the image, which
# is built from this same APT repo (see ../../container/Dockerfile).
#
# Pin the Intel MPI release to MATCH the image's Intel MPI (the Dockerfile and
# the ../../ansible intel_oneapi role track the 2026.0 oneAPI toolkit). The
# release metapackage is "intel-oneapi-mpi-<version>". Set intel_mpi_version to
# "" to take the latest available in the repo instead of pinning.
# Verify the image's version with:
#   apptainer exec clam-wrf.sif bash -lc \
#     'source /opt/intel/oneapi/setvars.sh >/dev/null; mpirun --version'
intel_mpi_version: "2026.0"

intel_mpi_packages:
  - "intel-oneapi-mpi{{ ('-' ~ intel_mpi_version) if intel_mpi_version | length > 0 else '' }}"

intel_mpi_apt_key_url: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
intel_mpi_apt_keyring: "/usr/share/keyrings/oneapi-archive-keyring.gpg"
intel_mpi_apt_repo: "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main"

# setvars.sh the launcher scripts source to put mpirun on PATH.
intel_mpi_setvars: "/opt/intel/oneapi/setvars.sh"
