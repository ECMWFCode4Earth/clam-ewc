---
# ============================================================
# CLAM WRF/WPS container deployment - global variables
#
# Override in the inventory, in host_vars/, or on the command line with -e.
# ============================================================

# Repository directories on the Ansible control node, relative to this
# playbook (clam-ewc/ansible_container/). Used as copy sources.
clam_repo_root: "{{ playbook_dir }}/.."
clam_container_src: "{{ clam_repo_root }}/container"

# Where the launcher scripts and run_scripts variants are deployed on the
# target host.
clam_deploy_dir: "{{ ansible_user_dir }}/clam-ewc"

# SIF image: source on the control node, destination on the target.
# Build it first with ../container/build_sif.sh; override clam_sif_src if the
# file lives elsewhere (e.g. -e clam_sif_src=/mnt/data1/clam-wrf.sif).
clam_sif_src: "{{ clam_repo_root }}/clam-wrf.sif"
clam_sif_dest: "{{ clam_deploy_dir }}/clam-wrf.sif"

# Optionally BUILD the SIF on the target from a container registry reference
# instead of copying a prebuilt file. When set, `apptainer build` pulls this
# reference into clam_sif_dest (clam_sif_src is then ignored). Examples:
#   docker://ghcr.io/<org>/clam-wrf:latest
#   oras://registry.example.com/clam-wrf:2026.0
clam_sif_registry: ""
# Rebuild even if clam_sif_dest already exists.
clam_sif_force_build: false
# Credentials for a PRIVATE registry (registry build only). Leave the username
# empty for public images. The PASSWORD is not stored here: it is prompted at
# run time (site.yml vars_prompt) or supplied non-interactively via
# -e clam_registry_password=... or an encrypted -e @vault.yml.
clam_registry_username: ""

# Host data directory bound into the container at /data (GEOG/ BC/ RUNS/).
clam_data_dir: "{{ ansible_user_dir }}/clam-data"

# Which bundled run-script variants to deploy to the host (handy as
# RUN_SCRIPTS overrides; the image already bundles them too).
clam_run_variants:
  - run_scripts
  - run_scripts_large
  - run_scripts_opendata

# Apptainer version: empty => Ubuntu apptainer/ppa package; set e.g. "1.3.6"
# to install the official GitHub release .deb instead.
apptainer_version: ""

# Install Intel MPI on the host ONLY when needed. Single-node runs need just
# Apptainer; MULTI-NODE runs need the host mpirun/Hydra launcher (same release
# as the image). Set true for multi-node hosts, e.g. -e clam_install_oneapi=true.
clam_install_oneapi: false
