---
# ============================================================
# CLAM WRF/WPS container deployment
#
# Deploys the prebuilt Apptainer image and the run scripts to one or more
# Ubuntu 24.04 hosts. It does NOT build WRF/WPS: that is done once by the
# ../container/build_sif.sh image build (or the ../ansible playbook).
#
# Role                | Purpose
# --------------------+-----------------------------------------------------
# apptainer           | Install Apptainer (../container/install_apptainer.sh)
# intel_mpi           | Install host Intel MPI (mpirun) - ONLY when
#                     | clam_install_oneapi=true (needed for multi-node runs)
# sif_deploy          | Provide clam-wrf.sif on each target: copy a prebuilt
#                     | file, or build from a registry ref (clam_sif_registry)
# run_scripts_deploy  | Copy the launcher scripts + run_scripts variants and
#                     | create the host data directory skeleton (GEOG/BC/RUNS)
#
# Usage:
#   cp inventory/hosts.ini.example inventory/hosts.ini && $EDITOR inventory/hosts.ini
#   ansible-playbook site.yml
#   ansible-playbook site.yml -e clam_sif_src=/path/to/clam-wrf.sif
#   ansible-playbook site.yml -e clam_sif_registry=docker://ghcr.io/org/clam-wrf:latest
#   ansible-playbook site.yml -e clam_deploy_dir=/opt/clam -e clam_data_dir=/data/clam
#   ansible-playbook site.yml -e clam_install_oneapi=true   # multi-node: host mpirun
#   ansible-playbook site.yml --tags apptainer      # install Apptainer only
#   ansible-playbook site.yml --tags deploy         # copy SIF + scripts only
# ============================================================

- name: Deploy the CLAM WRF/WPS container
  hosts: clam
  become: false
  gather_facts: true

  vars_prompt:
    # Private-registry password for building the SIF from clam_sif_registry.
    # Non-interactive runs (no TTY) use the empty default; passing
    # -e clam_registry_password=... or an encrypted -e @vault.yml skips the
    # prompt. Press Enter to skip for public images / copy mode.
    - name: clam_registry_password
      prompt: "Private registry password (Enter to skip for public images)"
      private: true
      default: ""
      confirm: false
      unsafe: true

  pre_tasks:
    - name: Check the target distribution
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
        fail_msg: >-
          This deployment playbook targets Ubuntu 24.04.
          Found {{ ansible_distribution }} {{ ansible_distribution_version }}.
        success_msg: "{{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Report the deployment layout
      ansible.builtin.debug:
        msg:
          - "DEPLOY_DIR = {{ clam_deploy_dir }}"
          - "SIF source = {{ 'registry build: ' ~ clam_sif_registry if clam_sif_registry | length > 0 else 'copy from control node: ' ~ clam_sif_src }}"
          - "SIF_DEST   = {{ clam_sif_dest }}"
          - "DATA_DIR   = {{ clam_data_dir }}"
          - "Apptainer  = {{ 'GitHub .deb v' ~ apptainer_version if apptainer_version | length > 0 else 'apptainer/ppa' }}"
          - "Intel MPI (host, multi-node) = {{ clam_install_oneapi | bool }}"

  roles:
    - role: apptainer
      tags: [apptainer]

    # Host Intel MPI launcher, installed ONLY when enabled (multi-node runs).
    - role: intel_mpi
      when: clam_install_oneapi | bool
      tags: [oneapi, mpi]

    - role: sif_deploy
      tags: [sif, deploy]

    - role: run_scripts_deploy
      tags: [scripts, deploy]

  post_tasks:
    - name: How to launch a run
      ansible.builtin.debug:
        msg:
          - "Single node:"
          - "  IMG={{ clam_sif_dest }} DATA_DIR={{ clam_data_dir }} {{ clam_deploy_dir }}/container/run_apptainer.sh"
          - "Multi node (edit HOSTS):"
          - "  HOSTS=vm01,vm03 PPN=16 IMG={{ clam_sif_dest }} DATA_DIR={{ clam_data_dir }} {{ clam_deploy_dir }}/container/run_multinode.sh"
